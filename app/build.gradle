plugins { id 'com.android.application' }

def keystorePropsFile = rootProject.file("keystore.properties")
def keystoreProps = new Properties()
if (keystorePropsFile.exists()) {
    keystoreProps.load(new FileInputStream(keystorePropsFile))
}

android {
    namespace 'com.nauty.launcher3d'
    compileSdk 34

    defaultConfig {
        applicationId "com.nauty.launcher3d"
        minSdk 31             // 도우미가 AttributionSource(API 31)를 쓴다. 실기는 Android 13
        targetSdk 34
        versionCode 4
        versionName "0.1.3"
        ndk { abiFilters 'arm64-v8a' }
    }

    buildFeatures {
        buildConfig true
        aidl true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    packaging {
        jniLibs { useLegacyPackaging true }
    }

    signingConfigs {
        release {
            // DepthFlix 와 같은 키. keystore.properties 와 .jks 는 저장소에 넣지 않는다.
            if (keystoreProps["storeFile"] != null) {
                storeFile     file(keystoreProps["storeFile"])
                storePassword keystoreProps["storePassword"]
                keyAlias      keystoreProps["keyAlias"]
                keyPassword   keystoreProps["keyPassword"]
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (keystoreProps["storeFile"] != null) {
                signingConfig signingConfigs.release
            }
        }
    }
    lint { abortOnError false }
}

dependencies {
    // Shizuku: 무선 디버깅으로 띄운 shell 권한 프로세스에서 도우미(HelperService)를 돌린다.
    implementation 'dev.rikka.shizuku:api:13.1.5'
    implementation 'dev.rikka.shizuku:provider:13.1.5'

    // RedMagic CNSDK 커넥터 — 기기의 CalibrationK68 에서 꺼낸 것 (저장소에 넣지 않는다).
    // .so 두 개는 src/main/jniLibs/arm64-v8a/ 에 있다.
    implementation fileTree(dir: 'libs', include: ['leia-cnsdk*.jar'])
}
